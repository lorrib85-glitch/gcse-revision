name: Execute Stage 6 canonical runtime

on:
  push:
    branches:
      - agent/stage-6-canonical-runtime

permissions:
  contents: write

concurrency:
  group: stage6-canonical-runtime
  cancel-in-progress: true

jobs:
  migrate-consumers:
    if: contains(github.event.head_commit.message, 'Run Stage 6 consumer migration')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out Stage 6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-6-canonical-runtime
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate live consumers
        run: python .github/scripts/stage6_migrate_consumers.py

      - name: Generate canonical learner runtime
        run: pnpm curriculum:runtime:generate

      - name: Verify complete repository
        run: pnpm verify

      - name: Mobile runtime smoke at 390px
        run: |
          pnpm vite --host 127.0.0.1 > /tmp/stage6-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/stage6-vite.log; exit 1; fi

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const pageErrors = []
          page.on('pageerror', error => pageErrors.push(error.message))

          await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle' })
          const guest = page.getByRole('button', { name: 'Continue without Google' })
          if (await guest.isVisible().catch(() => false)) await guest.click()
          const nameInput = page.getByPlaceholder('Your name')
          if (await nameInput.isVisible().catch(() => false)) {
            await nameInput.fill('Stage Six')
            await page.getByRole('button', { name: 'Continue →' }).click()
          }
          const streakDialog = page.getByRole('dialog', { name: /day streak/ })
          if (await streakDialog.isVisible().catch(() => false)) {
            await streakDialog.getByRole('button', { name: 'Continue' }).click()
            await streakDialog.waitFor({ state: 'hidden' })
          }

          await page.getByRole('button', { name: 'Subjects' }).click()
          await page.getByText('Your subjects', { exact: true }).waitFor()
          await page.getByRole('button', { name: /^History/ }).first().click()
          await page.getByText('Medicine through time', { exact: true }).first().waitFor()
          await page.getByText("Trust me, I'm Following Jupiter", { exact: true }).first().click()
          await page.waitForTimeout(1200)
          if (pageErrors.length) throw new Error(`runtime page errors: ${pageErrors.join(' | ')}`)
          await browser.close()
          NODE

      - name: Commit canonical consumer migration
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Move live curriculum consumers to canonical runtime"
          git push origin HEAD:agent/stage-6-canonical-runtime
