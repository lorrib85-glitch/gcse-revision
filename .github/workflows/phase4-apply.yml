name: Apply Phase 4 chapter runtime migration

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/content-hierarchy-phase-4]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-hierarchy-phase-4
          fetch-depth: 1
          show-progress: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply fail-fast runtime migration
        id: apply
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/phase4-migrate.mjs')
          source = path.read_text()

          old_props = """const embeddedChapterProps = (chapterPlayer.match(/\\bchapter=\\{chapter\\}/g) || []).length
          if (embeddedChapterProps !== 2) {
            throw new Error(`ChapterPlayer: expected 2 embedded chapter props, found ${embeddedChapterProps}`)
          }
          """
          new_props = """const embeddedChapterProps = (chapterPlayer.match(/\\bchapter=\\{chapter\\}/g) || []).length
          if (embeddedChapterProps !== 5) {
            throw new Error(`ChapterPlayer: expected 5 embedded chapter props, found ${embeddedChapterProps}`)
          }
          """
          if source.count(old_props) != 1:
              raise SystemExit('Phase 4 embedded-prop assertion anchor changed')
          source = source.replace(old_props, new_props)

          old_next = "chapterNavigation = chapterNavigation.replaceAll('nextMod', 'nextChapter')"
          new_next = "chapterNavigation = chapterNavigation.replace(/\\bnextMod\\b/g, 'nextChapter')"
          if source.count(old_next) != 1:
              raise SystemExit('Phase 4 nextMod transform anchor changed')
          source = source.replace(old_next, new_next)

          path.write_text(source)
          PY
          set -o pipefail
          node .github/phase4-migrate.mjs 2>&1 | tee /tmp/phase4-migration.txt

      - name: Upload migration assertion failure
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase4-migration-failure
          path: /tmp/phase4-migration.txt

      - name: Stop after migration assertion failure
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - run: pnpm install --frozen-lockfile

      - name: Architecture contracts
        id: architecture
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:architecture 2>&1 | tee /tmp/phase4-architecture.txt

      - name: Upload architecture failure
        if: steps.architecture.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase4-architecture-failure
          path: /tmp/phase4-architecture.txt

      - name: Stop after architecture failure
        if: steps.architecture.outcome == 'failure'
        run: exit 1

      - name: Focused Phase 4 runtime contracts
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec vitest run --project unit \
            tests/unit/app/chapterNavigation.test.js \
            tests/unit/app/moduleNavigation.test.js \
            tests/unit/chapterPlayer/lifecycle.test.js \
            tests/unit/modulePlayer/lifecycle.test.js \
            tests/unit/modulePlayer/compatibility.test.js \
            tests/unit/journeys/learnerJourneys.test.js \
            2>&1 | tee /tmp/phase4-focused.txt

      - name: Upload focused runtime failure
        if: steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase4-focused-failure
          path: /tmp/phase4-focused.txt

      - name: Stop after focused runtime failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Full unit suite
        run: pnpm test:unit

      - name: Changed-file lint
        run: >-
          pnpm exec eslint
          src/app/LegacyApp.jsx
          src/app/chapterNavigation.js
          src/app/moduleNavigation.js
          src/components/layout/ChapterPlayer.jsx
          src/components/layout/ModulePlayer.jsx
          src/components/core/LearningHeader.jsx
          src/components/learning/GuidedExamResponse.jsx
          src/components/learning/faceTheExaminer/FaceTheExaminerContainer.jsx
          tests/architecture/chapter-runtime-contract.test.js
          tests/architecture/legacy-content-imports.test.js
          tests/architecture/placeholder-module-safety.test.js
          tests/architecture/background-token-governance.test.js
          tests/architecture/foreground-token-governance.test.js
          tests/architecture/typography-governance.test.js
          tests/unit/app/chapterNavigation.test.js
          tests/unit/chapterPlayer/lifecycle.test.js
          tests/unit/modulePlayer/compatibility.test.js
          tests/unit/journeys/learnerJourneys.test.js

      - name: Production build
        run: pnpm build

      - name: Commit validated Phase 4 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/LegacyApp.jsx \
            src/app/chapterNavigation.js \
            src/app/moduleNavigation.js \
            src/components/layout/ChapterPlayer.jsx \
            src/components/layout/ModulePlayer.jsx \
            src/components/core/LearningHeader.jsx \
            src/components/learning/GuidedExamResponse.jsx \
            src/components/learning/faceTheExaminer/FaceTheExaminerContainer.jsx \
            tests/architecture/chapter-runtime-contract.test.js \
            tests/architecture/legacy-content-imports.test.js \
            tests/architecture/placeholder-module-safety.test.js \
            tests/architecture/background-token-governance.test.js \
            tests/architecture/foreground-token-governance.test.js \
            tests/architecture/typography-governance.test.js \
            tests/unit/app/chapterNavigation.test.js \
            tests/unit/chapterPlayer/lifecycle.test.js \
            tests/unit/modulePlayer/compatibility.test.js \
            tests/unit/journeys/learnerJourneys.test.js \
            docs/system/CONTENT_HIERARCHY.md
          git diff --cached --check
          git commit -m "Introduce the canonical ChapterPlayer runtime"
          git push origin HEAD:agent/content-hierarchy-phase-4
