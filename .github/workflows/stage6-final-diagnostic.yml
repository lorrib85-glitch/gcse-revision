name: Stage 6 final diagnostic

on:
  push:
    branches:
      - agent/stage-6-canonical-runtime

permissions:
  contents: write

concurrency:
  group: stage6-final-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'Run Stage 6 final diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-6-canonical-runtime
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Build final Stage 6 worktree
        run: |
          python .github/scripts/stage6_retire_compatibility.py
          python .github/scripts/stage6_retire_fix_generator.py
          python .github/scripts/stage6_fix_import_parser.py
          python .github/scripts/stage6_retire_fix_tests.py
          python .github/scripts/stage6_retire_fix_remaining.py
          python .github/scripts/stage6_fix_last_two.py
          python .github/scripts/stage6_fix_unit_boundaries.py
          pnpm curriculum:generate
          pnpm curriculum:navigation:generate
          pnpm curriculum:runtime:generate
          pnpm catalogue:generate

      - name: Architecture
        run: pnpm test:architecture

      - name: Lint
        run: pnpm lint

      - name: Unit
        run: pnpm test:unit

      - name: Storybook
        run: |
          set +e
          pnpm test:storybook > /tmp/stage6-storybook.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            tail -n 500 /tmp/stage6-storybook.log > stage6-final-failures.txt
            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git add stage6-final-failures.txt
            git commit -m "Record Stage 6 Storybook failures"
            git push origin HEAD:agent/stage-6-canonical-runtime
          fi
          exit "$code"

      - name: Build
        run: |
          set +e
          pnpm build > /tmp/stage6-build.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            tail -n 500 /tmp/stage6-build.log > stage6-final-failures.txt
            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git add stage6-final-failures.txt
            git commit -m "Record Stage 6 build failures"
            git push origin HEAD:agent/stage-6-canonical-runtime
          fi
          exit "$code"
