name: Apply Phase 5 governed screen migration

on:
  push:
    branches: [agent/content-hierarchy-phase-5]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-hierarchy-phase-5
          fetch-depth: 1
          show-progress: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply fail-fast Phase 5 migration
        id: migrate
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new)

          path = Path('.github/phase5-migrate.mjs')
          source = path.read_text()
          source = source.replace('\\\\`', '\\`')
          source = source.replace('\\\\${', '\\${')
          source = source.replace(
              "failures.push(\\`${id}: ${error.message}\\`)",
              "failures.push(id + ': ' + error.message)",
          )
          source = source.replace(
              "expect(Object.hasOwn(allowedLegacyMaximums, type), \\`Unexpected legacy type ${type}\\`).toBe(true)",
              "expect(Object.hasOwn(allowedLegacyMaximums, type), 'Unexpected legacy type ' + type).toBe(true)",
          )
          source = source.replace(
              "expect(count, \\`Legacy type ${type} grew\\`).toBeLessThanOrEqual(allowedLegacyMaximums[type])",
              "expect(count, 'Legacy type ' + type + ' grew').toBeLessThanOrEqual(allowedLegacyMaximums[type])",
          )
          path.write_text(source)

          registry_path = Path('src/data/screenRegistry.js')
          registry = registry_path.read_text()
          registry = replace_once(
              registry,
              "      { path: 'cards', kind: 'array' },\n    ]],\n  }),\n  matchingTask:",
              "      { path: 'cards', kind: 'array' },\n      { path: 'stages', kind: 'array' },\n    ]],\n  }),\n  matchingTask:",
              'ordered route variants',
          )
          registry = replace_once(
              registry,
              "  timelineCanvas: screen('Timeline canvas', 'TimelineCanvas', {\n    layout: 'full',\n    continuation: 'component',\n    requiredAny: [[\n      { path: 'events', kind: 'array' },\n      { path: 'items', kind: 'array' },\n    ]],\n  }),",
              "  timelineCanvas: screen('Timeline canvas', 'TimelineCanvas', {\n    layout: 'full',\n    continuation: 'component',\n    requiredAny: [[\n      { path: 'events', kind: 'array' },\n      { path: 'items', kind: 'array' },\n      { path: 'steps', kind: 'array' },\n    ]],\n  }),",
              'timeline canvas variants',
          )
          registry = replace_once(
              registry,
              "  keypoint: block('Key point', 'KeypointBlock', { required: [{ path: 'text', kind: 'string' }] }),",
              "  keypoint: block('Key point', 'KeypointBlock', {\n    requiredAny: [[\n      { path: 'text', kind: 'string' },\n      { path: 'points', kind: 'array' },\n    ]],\n  }),",
              'key point variants',
          )
          registry = replace_once(
              registry,
              "  scenario: block('Scenario block', 'ScenarioBlock', { required: [{ path: 'scenarios', kind: 'array' }] }),",
              "  scenario: block('Scenario block', 'ScenarioBlock', {\n    requiredAny: [[\n      { path: 'scenarios', kind: 'array' },\n      { path: 'situation', kind: 'string' },\n    ]],\n  }),",
              'scenario variants',
          )
          registry = replace_once(
              registry,
              "    requiredAny: [[\n      { path: 'markPoints', kind: 'string' },\n      { path: 'ms', kind: 'array' },\n      { path: 'markScheme', kind: 'array' },\n    ]],",
              "    requiredAny: [[\n      { path: 'markPoints', kind: 'string' },\n      { path: 'markPoints', kind: 'array' },\n      { path: 'ms', kind: 'string' },\n      { path: 'ms', kind: 'array' },\n      { path: 'markScheme', kind: 'string' },\n      { path: 'markScheme', kind: 'array' },\n    ]],",
              'exam question variants',
          )
          registry = replace_once(
              registry,
              "  factorWeb: screen('Factor web', 'FactorWeb', {",
              "  cinematicReveal: screen('Cinematic reveal (legacy)', 'ScreenContentRenderer', {\n    status: 'legacy',\n    replacement: 'cinematic',\n    headerMode: 'cinematic',\n  }),\n  video: screen('Video screen (legacy)', 'ScreenContentRenderer', {\n    status: 'legacy',\n    replacement: 'cinematic',\n    headerMode: 'cinematic',\n  }),\n  factorWeb: screen('Factor web', 'FactorWeb', {",
              'legacy cinematic aliases',
          )
          registry_path.write_text(registry)
          PY
          set -o pipefail
          node .github/phase5-migrate.mjs 2>&1 | tee /tmp/phase5-migration.txt
          python - <<'PY'
          from pathlib import Path

          renderer_path = Path('src/components/layout/ScreenRenderer.jsx')
          renderer = renderer_path.read_text()
          old = "  chapter,\n  subject = chapter?.subject,"
          new = "  chapter,\n  chapterNum,\n  subject = chapter?.subject,"
          if renderer.count(old) != 1:
              raise SystemExit('ScreenRenderer chapterNum prop anchor changed')
          renderer_path.write_text(renderer.replace(old, new))

          player_path = Path('src/components/layout/ChapterPlayer.jsx')
          player = player_path.read_text()
          old = "        chapter={chapter}\n        isLast={isLast}"
          new = "        chapter={chapter}\n        chapterNum={chapterNum}\n        isLast={isLast}"
          if player.count(old) != 1:
              raise SystemExit('ChapterPlayer chapterNum pass-through anchor changed')
          player_path.write_text(player.replace(old, new))
          PY

      - name: Upload migration failure
        if: steps.migrate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-migration-failure
          path: /tmp/phase5-migration.txt

      - name: Stop after migration failure
        if: steps.migrate.outcome == 'failure'
        run: exit 1

      - run: pnpm install --frozen-lockfile

      - name: Architecture contracts
        id: architecture
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:architecture 2>&1 | tee /tmp/phase5-architecture.txt

      - name: Upload architecture failure
        if: steps.architecture.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-architecture-failure
          path: /tmp/phase5-architecture.txt

      - name: Stop after architecture failure
        if: steps.architecture.outcome == 'failure'
        run: exit 1

      - name: Focused Phase 5 contracts
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec vitest run --project unit \
            tests/unit/data/screenRegistry.test.js \
            tests/unit/chapterPlayer/lifecycle.test.js \
            tests/unit/app/chapterNavigation.test.js \
            tests/unit/journeys/learnerJourneys.test.js \
            2>&1 | tee /tmp/phase5-focused.txt

      - name: Upload focused-test failure
        if: steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-focused-failure
          path: /tmp/phase5-focused.txt

      - name: Stop after focused-test failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee /tmp/phase5-unit.txt

      - name: Upload unit failure
        if: steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-unit-failure
          path: /tmp/phase5-unit.txt

      - name: Stop after unit failure
        if: steps.unit.outcome == 'failure'
        run: exit 1

      - name: Changed-file lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec eslint \
            src/data/screenRegistry.js \
            src/components/layout/ScreenRenderer.jsx \
            src/components/layout/ChapterPlayer.jsx \
            src/app/chapterNavigation.js \
            tests/architecture/screen-registry.test.js \
            tests/architecture/chapter-runtime-contract.test.js \
            tests/architecture/background-token-governance.test.js \
            tests/architecture/foreground-token-governance.test.js \
            tests/architecture/typography-governance.test.js \
            tests/unit/data/screenRegistry.test.js \
            2>&1 | tee /tmp/phase5-lint.txt

      - name: Upload lint failure
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-lint-failure
          path: /tmp/phase5-lint.txt

      - name: Stop after lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Production build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/phase5-build.txt

      - name: Upload build failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-build-failure
          path: /tmp/phase5-build.txt

      - name: Stop after build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Commit validated Phase 5 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/phase5-migrate.mjs
          rm -f .github/workflows/phase5-migrate.yml
          rm -f .github/workflows/phase5-screen-inventory.yml
          git add \
            src/data/screenRegistry.js \
            src/components/layout/ScreenRenderer.jsx \
            src/components/layout/ChapterPlayer.jsx \
            src/app/chapterNavigation.js \
            tests/architecture/screen-registry.test.js \
            tests/architecture/chapter-runtime-contract.test.js \
            tests/architecture/background-token-governance.test.js \
            tests/architecture/foreground-token-governance.test.js \
            tests/architecture/typography-governance.test.js \
            tests/unit/data/screenRegistry.test.js \
            docs/system/SCREEN_REGISTRY.md \
            docs/system/CONTENT_HIERARCHY.md \
            docs/system/00_SYSTEM_INDEX.md \
            .github/phase5-migrate.mjs \
            .github/workflows/phase5-migrate.yml \
            .github/workflows/phase5-screen-inventory.yml
          git diff --cached --check
          git commit -m "Govern chapter screens through a single registry"
          git push origin HEAD:agent/content-hierarchy-phase-5
