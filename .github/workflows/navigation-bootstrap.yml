name: Bootstrap canonical navigation projection

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: navigation-bootstrap-main
  cancel-in-progress: false

jobs:
  generate-and-verify:
    if: contains(github.event.head_commit.message, 'Implement canonical subject-browser navigation generator')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Storybook tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate the inert navigation projection
        run: pnpm curriculum:navigation:generate

      - name: Verify the complete repository
        run: pnpm verify

      - name: Commit generated outputs and remove this one-use workflow
        run: |
          rm .github/workflows/navigation-bootstrap.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add src/data/generated/curriculum/navigation.js docs/curriculum/NAVIGATION_MAP.md .github/workflows/navigation-bootstrap.yml
          git commit -m "Generate the canonical subject-browser projection"
          git push origin HEAD:main
