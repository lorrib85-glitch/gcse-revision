name: Phase 6 live vocabulary closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase6-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  close-live-vocabulary:
    if: github.head_ref == 'agent/content-hierarchy-phase-6-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-hierarchy-phase-6-final
          fetch-depth: 0
          show-progress: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply final live vocabulary migration
        run: python .github/phase6-live-vocabulary.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Architecture contracts
        run: pnpm test:architecture
      - name: Focused navigation, planning and recovery contracts
        run: pnpm exec vitest run tests/architecture/legacy-content-imports.test.js tests/architecture/chapter-runtime-contract.test.js tests/unit/app/chapterNavigation.test.js tests/unit/todaysPlan.test.js tests/unit/journeys/learnerJourneys.test.js tests/unit/weaknessRouting/quickfireRouting.test.js tests/unit/chapterPlayer/lifecycle.test.js tests/unit/chapterPlayer/lifecycle-regression.test.js
      - name: Full unit suite
        run: pnpm test:unit
      - name: Changed-file lint
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD; git diff --name-only --diff-filter=ACMR)
          mapfile -t js_files < <(printf '%s\n' "${files[@]}" | sort -u | grep -E '\.(js|jsx)$' || true)
          if [ ${#js_files[@]} -gt 0 ]; then pnpm exec eslint "${js_files[@]}"; fi
      - name: Production build
        run: pnpm build
      - name: Commit clean final Phase 6 files
        shell: bash
        run: |
          rm -f .github/phase6-live-vocabulary.py .github/workflows/phase6-live-vocabulary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish the canonical chapter vocabulary migration"
          git push origin HEAD:agent/content-hierarchy-phase-6-final
