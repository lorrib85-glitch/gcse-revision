name: Apply Phase 3 chapter progress migration

on:
  push:
    branches: [agent/content-hierarchy-phase-3]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-hierarchy-phase-3
          fetch-depth: 1
          show-progress: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply fail-fast migration edits
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          (
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/phase3-migrate.mjs')
          source = path.read_text()

          old_helper = """function replaceRegex(path, pattern, to, expected = 1) {
            const source = read(path)
            const matches = [...source.matchAll(pattern)]
            if (matches.length !== expected) {
              throw new Error(`${path}: expected ${expected} regex matches, found ${matches.length}: ${pattern}`)
            }
            write(path, source.replace(pattern, to))
          }
          """
          new_helper = """function replaceRegex(path, pattern, to, expected = 1) {
            const source = read(path)
            const flags = pattern.flags.includes('g') ? pattern.flags : pattern.flags + 'g'
            const matches = [...source.matchAll(new RegExp(pattern.source, flags))]
            if (matches.length !== expected) {
              throw new Error(`${path}: expected ${expected} regex matches, found ${matches.length}: ${pattern}`)
            }
            write(path, source.replace(pattern, to))
          }

          function replaceRegexAllChecked(path, pattern, to, minimum = 1) {
            const source = read(path)
            const flags = pattern.flags.includes('g') ? pattern.flags : pattern.flags + 'g'
            const globalPattern = new RegExp(pattern.source, flags)
            const matches = [...source.matchAll(globalPattern)]
            if (matches.length < minimum) {
              throw new Error(`${path}: expected at least ${minimum} regex matches, found ${matches.length}: ${pattern}`)
            }
            write(path, source.replace(globalPattern, to))
          }
          """
          if source.count(old_helper) != 1:
              raise SystemExit('Phase 3 regex-helper anchor changed')
          source = source.replace(old_helper, new_helper)

          old_planner = """replaceAllChecked('src/features/planner/dailyPlanner.js', 'MODULE_GROUPS', '__PARENT_MODULES__', 1)
          replaceAllChecked('src/features/planner/dailyPlanner.js', 'MODULES', 'CHAPTERS', 1)
          replaceAllChecked('src/features/planner/dailyPlanner.js', '__PARENT_MODULES__', 'PARENT_MODULES', 1)
          replaceExact(
            'src/features/planner/dailyPlanner.js',
            \"import { CHAPTERS, isModuleAvailable } from '../../modules.js'\\nimport { PARENT_MODULES } from '../../progress.js'\\nimport { getArray, getObject, setJson, saveCritical } from '../../lib/storage.js'\",
            \"import { CHAPTERS, isChapterAvailable } from '../../chapters.js'\\nimport { MODULES as PARENT_MODULES } from '../../data/modules.js'\\nimport { getChapterState } from '../../progress.js'\\nimport { getArray, getObject, setJson, saveCritical } from '../../lib/storage.js'\",
          )
          """
          new_planner = """replaceExact(
            'src/features/planner/dailyPlanner.js',
            \"import { MODULES, isModuleAvailable } from '../../modules.js'\\nimport { MODULE_GROUPS } from '../../progress.js'\\nimport { getArray, getObject, setJson, saveCritical } from '../../lib/storage.js'\",
            \"import { CHAPTERS, isChapterAvailable } from '../../chapters.js'\\nimport { MODULES as PARENT_MODULES } from '../../data/modules.js'\\nimport { getChapterState } from '../../progress.js'\\nimport { getArray, getObject, setJson, saveCritical } from '../../lib/storage.js'\",
          )
          replaceAllChecked('src/features/planner/dailyPlanner.js', 'MODULE_GROUPS', 'PARENT_MODULES', 1)
          replaceRegexAllChecked('src/features/planner/dailyPlanner.js', /\\bMODULES\\b/g, 'CHAPTERS', 1)
          """
          if source.count(old_planner) != 1:
              raise SystemExit('Phase 3 planner-transform anchor changed')
          source = source.replace(old_planner, new_planner)

          old_allowlist = """replaceExact(
            'tests/architecture/legacy-content-imports.test.js',
            \"        'src/features/subjects/Subjects.jsx',\\n\",
            '',
          )
          """
          new_allowlist = """replaceExact(
            'tests/architecture/legacy-content-imports.test.js',
            \"        'src/features/quickfire/logic/convertBankQuestion.js',\\n        'src/features/subjects/Subjects.jsx',\\n        'src/unifiedWeaknessTracker.js',\\n\",
            \"        'src/features/quickfire/logic/convertBankQuestion.js',\\n        'src/unifiedWeaknessTracker.js',\\n\",
          )
          """
          if source.count(old_allowlist) != 1:
              raise SystemExit('Phase 3 recovery-allowlist anchor changed')
          source = source.replace(old_allowlist, new_allowlist)

          old_docs = "  'Phase 2 changes no storage keys and no learner-facing behaviour.',"
          new_docs = "  'Phases 1 and 2 change no storage keys and no learner-facing behaviour.',"
          if source.count(old_docs) != 1:
              raise SystemExit('Phase 3 content-hierarchy documentation anchor changed')
          source = source.replace(old_docs, new_docs)

          path.write_text(source)
          PY
            node .github/phase3-migrate.mjs
          ) 2>&1 | tee /tmp/phase3-error.txt

      - name: Upload failed assertion
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-assertion-failure
          path: /tmp/phase3-error.txt

      - name: Stop after failed assertion
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - run: pnpm install --frozen-lockfile

      - name: Architecture contracts
        run: pnpm test:architecture

      - name: Phase 3 migration contracts
        run: >-
          pnpm exec vitest run --project unit
          tests/unit/progressSync/chapterProgressPersistence.test.js
          tests/unit/progressSync/chapterProgressMerge.test.js
          tests/unit/progressSync/chapterProgressSnapshot.test.js
          tests/unit/progressSync/progressSync.test.js
          tests/unit/progressSync/accountScope.test.js
          tests/unit/planner/dailyPlanner.test.js
          tests/unit/journeys/learnerJourneys.test.js
          tests/unit/journeys/accountIsolationJourneys.test.js
          tests/unit/saveFailure/progressFailureIntegration.test.js

      - name: Full unit suite
        run: pnpm test:unit

      - name: Changed-file lint
        run: >-
          pnpm exec eslint
          src/data/chapterProgress.js
          src/data/progressSync/canonicalProgressMerge.js
          src/data/progressSync/progressSync.js
          src/data/progressSync/accountScope.js
          src/data/progressSync/snapshotBudget.js
          src/progress.js
          src/todaysPlan.js
          src/app/LegacyApp.jsx
          src/components/layout/ModulePlayer.jsx
          src/features/subjects/Subjects.jsx
          src/features/planner/dailyPlanner.js
          scripts/contact-sheet.mjs
          .storybook/preview.jsx
          tests/architecture/legacy-content-imports.test.js
          tests/unit/progressSync/chapterProgressPersistence.test.js
          tests/unit/progressSync/chapterProgressMerge.test.js
          tests/unit/progressSync/chapterProgressSnapshot.test.js
          tests/unit/progressSync/progressMerge.test.js
          tests/unit/progressSync/progressSync.test.js
          tests/unit/progressSync/accountScope.test.js
          tests/unit/progressSync/snapshotBudget.test.js
          tests/unit/planner/dailyPlanner.test.js
          tests/unit/journeys/learnerJourneys.test.js
          tests/unit/journeys/accountIsolationJourneys.test.js
          tests/unit/journeys/persistenceGrowthJourneys.test.js
          tests/unit/saveFailure/progressFailureIntegration.test.js

      - name: Production build
        run: pnpm build

      - name: Package validated Phase 3 files
        run: |
          git diff --check
          mkdir -p /tmp/phase3-validated/files
          git diff --name-only | grep -v '^.github/' > /tmp/phase3-validated/changed-files.txt
          while IFS= read -r file; do
            mkdir -p "/tmp/phase3-validated/files/$(dirname "$file")"
            cp "$file" "/tmp/phase3-validated/files/$file"
          done < /tmp/phase3-validated/changed-files.txt
          git diff -- . ':(exclude).github/**' > /tmp/phase3-validated/phase3.diff

      - name: Upload validated Phase 3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase3-validated-files
          path: /tmp/phase3-validated
