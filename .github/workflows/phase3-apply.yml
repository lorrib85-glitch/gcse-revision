name: Apply Phase 3 chapter progress migration

on:
  push:
    branches: [agent/content-hierarchy-phase-3]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-hierarchy-phase-3
          fetch-depth: 1
          show-progress: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply fail-fast migration edits
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          (
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/phase3-migrate.mjs')
          source = path.read_text()
          old = """function replaceRegex(path, pattern, to, expected = 1) {
            const source = read(path)
            const matches = [...source.matchAll(pattern)]
            if (matches.length !== expected) {
              throw new Error(`${path}: expected ${expected} regex matches, found ${matches.length}: ${pattern}`)
            }
            write(path, source.replace(pattern, to))
          }
          """
          new = """function replaceRegex(path, pattern, to, expected = 1) {
            const source = read(path)
            const flags = pattern.flags.includes('g') ? pattern.flags : pattern.flags + 'g'
            const matches = [...source.matchAll(new RegExp(pattern.source, flags))]
            if (matches.length !== expected) {
              throw new Error(`${path}: expected ${expected} regex matches, found ${matches.length}: ${pattern}`)
            }
            write(path, source.replace(pattern, to))
          }
          """
          if source.count(old) != 1:
              raise SystemExit('Phase 3 regex-helper anchor changed')
          path.write_text(source.replace(old, new))
          PY
            node .github/phase3-migrate.mjs
          ) 2>&1 | tee /tmp/phase3-error.txt

      - name: Publish failed assertion only
        if: steps.apply.outcome == 'failure'
        run: |
          git reset --hard HEAD
          cp /tmp/phase3-error.txt .github/phase3-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/phase3-error.txt
          git commit -m "Record Phase 3 migration assertion failure"
          git push origin HEAD:agent/content-hierarchy-phase-3

      - name: Stop after failed assertion
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - run: pnpm install --frozen-lockfile

      - name: Architecture contracts
        run: pnpm test:architecture

      - name: Phase 3 migration contracts
        run: >-
          pnpm exec vitest run --project unit
          tests/unit/progressSync/chapterProgressPersistence.test.js
          tests/unit/progressSync/chapterProgressMerge.test.js
          tests/unit/progressSync/chapterProgressSnapshot.test.js
          tests/unit/progressSync/progressSync.test.js
          tests/unit/progressSync/accountScope.test.js
          tests/unit/planner/dailyPlanner.test.js
          tests/unit/journeys/learnerJourneys.test.js
          tests/unit/journeys/accountIsolationJourneys.test.js
          tests/unit/saveFailure/progressFailureIntegration.test.js

      - name: Full unit suite
        run: pnpm test:unit

      - name: Changed-file lint
        run: >-
          pnpm exec eslint
          src/data/chapterProgress.js
          src/data/progressSync/canonicalProgressMerge.js
          src/data/progressSync/progressSync.js
          src/data/progressSync/accountScope.js
          src/data/progressSync/snapshotBudget.js
          src/progress.js
          src/todaysPlan.js
          src/app/LegacyApp.jsx
          src/components/layout/ModulePlayer.jsx
          src/features/subjects/Subjects.jsx
          src/features/planner/dailyPlanner.js
          scripts/contact-sheet.mjs
          .storybook/preview.jsx
          tests/architecture/legacy-content-imports.test.js
          tests/unit/progressSync/chapterProgressPersistence.test.js
          tests/unit/progressSync/chapterProgressMerge.test.js
          tests/unit/progressSync/chapterProgressSnapshot.test.js
          tests/unit/progressSync/progressMerge.test.js
          tests/unit/progressSync/progressSync.test.js
          tests/unit/progressSync/accountScope.test.js
          tests/unit/progressSync/snapshotBudget.test.js
          tests/unit/planner/dailyPlanner.test.js
          tests/unit/journeys/learnerJourneys.test.js
          tests/unit/journeys/accountIsolationJourneys.test.js
          tests/unit/journeys/persistenceGrowthJourneys.test.js
          tests/unit/saveFailure/progressFailureIntegration.test.js

      - name: Production build
        run: pnpm build

      - name: Commit validated migration
        run: |
          git diff --check
          git rm .github/phase3-migrate.mjs .github/workflows/phase3-apply.yml
          rm -f .github/phase3-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate chapter progress persistence"
          git push origin HEAD:agent/content-hierarchy-phase-3
