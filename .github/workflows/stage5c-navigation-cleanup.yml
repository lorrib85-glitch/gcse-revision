name: Execute Stage 5C navigation cleanup

on:
  push:
    branches:
      - agent/stage-5c-navigation-cleanup

permissions:
  contents: write

concurrency:
  group: stage5c-navigation-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'Run Stage 5C cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-5c-navigation-cleanup
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prove the legacy chapter-image map is unreachable
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { CHAPTERS } from './src/chapters.js'

          const source = readFileSync('src/features/subjects/Subjects.jsx', 'utf8')
          const match = source.match(/const CHAPTER_HEADER_IMAGES = (\{[\s\S]*?\n\})/)
          if (!match) throw new Error('CHAPTER_HEADER_IMAGES was not found before Stage 5C cleanup')
          const legacyMap = Function(`"use strict"; return (${match[1]})`)()
          const chapterById = new Map(CHAPTERS.map(chapter => [chapter.id, chapter]))
          const missingCanonicalImages = Object.keys(legacyMap).filter(id => !chapterById.get(id)?.headerImage)
          if (missingCanonicalImages.length) {
            throw new Error(`legacy fallback is still reachable for: ${missingCanonicalImages.join(', ')}`)
          }
          console.log(`Proved ${Object.keys(legacyMap).length} legacy image fallbacks are unreachable.`)
          NODE

      - name: Apply Stage 5C cleanup
        run: python .github/scripts/stage5c_cleanup.py

      - name: Regenerate canonical navigation
        run: pnpm curriculum:navigation:generate

      - name: Verify complete repository
        run: pnpm verify

      - name: Mobile runtime smoke at 390px
        run: |
          pnpm vite --host 127.0.0.1 > /tmp/stage5c-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/stage5c-vite.log
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const pageErrors = []
          page.on('pageerror', error => pageErrors.push(error.message))

          await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle' })
          const guest = page.getByRole('button', { name: 'Continue without Google' })
          if (await guest.isVisible().catch(() => false)) await guest.click()
          const nameInput = page.getByPlaceholder('Your name')
          if (await nameInput.isVisible().catch(() => false)) {
            await nameInput.fill('Stage Five')
            await page.getByRole('button', { name: 'Continue →' }).click()
          }
          const streakDialog = page.getByRole('dialog', { name: /day streak/ })
          if (await streakDialog.isVisible().catch(() => false)) {
            await streakDialog.getByRole('button', { name: 'Continue' }).click()
            await streakDialog.waitFor({ state: 'hidden' })
          }

          await page.getByRole('button', { name: 'Subjects' }).waitFor()
          await page.getByRole('button', { name: 'Subjects' }).click()
          await page.getByText('Your subjects', { exact: true }).waitFor()

          const destinations = [
            ['History', 'Medicine through time'],
            ['Biology', 'AQA Biology'],
            ['Chemistry', 'AQA Chemistry'],
            ['Physics', 'AQA Physics'],
            ['Maths', 'AQA Mathematics'],
            ['English', 'Macbeth'],
            ['Sociology', 'AQA Sociology'],
          ]
          for (const [label, title] of destinations) {
            await page.getByRole('button', { name: new RegExp(`^${label}`) }).first().click()
            await page.getByText(title, { exact: true }).first().waitFor()
            await page.getByRole('button', { name: 'Go back' }).click()
            await page.getByText('Your subjects', { exact: true }).waitFor()
          }

          if (pageErrors.length) throw new Error(`runtime page errors: ${pageErrors.join(' | ')}`)
          await browser.close()
          NODE

      - name: Commit Stage 5C
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Close Stage 5C navigation cleanup"
          git push origin HEAD:agent/stage-5c-navigation-cleanup
