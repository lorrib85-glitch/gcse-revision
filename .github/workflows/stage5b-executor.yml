name: Execute Stage 5B cutover

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stage5b-cutover-main
  cancel-in-progress: true

jobs:
  execute:
    if: contains(github.event.head_commit.message, 'Run canonical browser cutover')
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply guarded Stage 5B source and test changes
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/stage5b-cutover.yml').read_text().splitlines()
          wanted = [
              'Write generated-navigation browser adapter',
              'Switch Subjects onto Browser Entry authority',
              'Replace legacy browser unit tests',
              'Update navigation architecture gates',
              'Update navigation lifecycle text',
          ]

          def extract_block(name):
              marker = f'      - name: {name}'
              start = workflow.index(marker)
              run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
              collected = []
              for line in workflow[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if line.startswith('          '):
                      collected.append(line[10:])
                  elif line == '':
                      collected.append('')
                  else:
                      raise RuntimeError(f'unexpected workflow indentation in {name}: {line!r}')
              return '\n'.join(collected) + '\n'

          for name in wanted:
              script = extract_block(name)
              if name == 'Update navigation architecture gates':
                  script = script.replace('\n    parity,\n', '\n    lambda _: parity,\n')
                  script = script.replace('\n    boundary,\n', '\n    lambda _: boundary,\n')
                  if 'lambda _: parity' not in script or 'lambda _: boundary' not in script:
                      raise RuntimeError('failed to repair architecture-test replacement callables')
              print(f'::group::{name}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
              print('::endgroup::', flush=True)
          PY

      - name: Update superseded Stage 4 and Stage 5A guards
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # The UI adapter does not need a moduleId payload. Module identity remains
          # in the generated projection; browser cards use navigationKind + id.
          adapter = Path('src/features/subjects/subjectCatalogue.js')
          source = adapter.read_text()
          source = source.replace('      moduleId: card.moduleId ?? null,\n', '')
          source = source.replace('      moduleId: null,\n', '')
          assert 'moduleId:' not in source
          adapter.write_text(source)

          # Stage 4 guards remain strict for the three runtime projections. The
          # Stage 5B navigation projection has its own one-adapter boundary test.
          parity = Path('tests/architecture/curriculum-projection-parity.test.js')
          source = parity.read_text()
          source = source.replace(
              "const REACHES_GENERATED = /(?:from\\s*|import\\s*\\(?\\s*)['\"][^'\"]*generated\\/curriculum\\//",
              "const REACHES_RUNTIME_GENERATED = /(?:from\\s*|import\\s*\\(?\\s*)['\"][^'\"]*generated\\/curriculum\\/(?:modules|chapters|chapterContentLoaders)\\.js/",
          )
          source = source.replace('REACHES_GENERATED', 'REACHES_RUNTIME_GENERATED')
          source = source.replace(
              "it('is exactly three files wide — only the boundary files import the projections', () => {",
              "it('is exactly three files wide — only the boundary files import the runtime projections', () => {",
          )
          source = source.replace(
              "'a fourth file reached past the boundary'",
              "'a fourth file reached a Stage 4 runtime projection'",
          )
          assert 'REACHES_GENERATED' not in source
          assert 'REACHES_RUNTIME_GENERATED' in source
          parity.write_text(source)

          vocabulary = Path('tests/architecture/canonical-vocabulary.test.js')
          source = vocabulary.read_text()
          old = "const reaches = /(?:from\\s*|import\\s*\\(?\\s*)['\"][^'\"]*generated\\/curriculum\\//"
          new = "const reaches = /(?:from\\s*|import\\s*\\(?\\s*)['\"][^'\"]*generated\\/curriculum\\/(?:modules|chapters|chapterContentLoaders)\\.js/"
          assert old in source
          source = source.replace(old, new, 1)
          source = source.replace(
              '// The Stage 4 boundary is exactly three files wide. A fourth importer would\n    // mean a consumer had been re-pointed past the public files.',
              '// The Stage 4 runtime boundary is exactly three files wide. The separate\n    // Stage 5B navigation projection is guarded by curriculum-navigation.test.js.',
          )
          vocabulary.write_text(source)

          # Browser subject coverage now derives from generated navigation through
          # the adapter, not from a removed display-title object in Subjects.jsx.
          app = Path('tests/architecture/app-boundaries.test.js')
          source = app.read_text()
          import_line = "import { SUBJECTS } from '../../src/constants/subjects.js'\n"
          replacement = import_line + "import { SUBJECT_NAVIGATION_NAMES } from '../../src/features/subjects/subjectCatalogue.js'\n"
          assert import_line in source
          source = source.replace(import_line, replacement, 1)
          pattern = re.compile(
              r"  // Field presence, not colour uniqueness:.*?  it\('every subject the browser displays owns both presentation roles', \(\) => \{.*?\n  \}\)\n",
              re.S,
          )
          replacement_test = """  // Field presence, not colour uniqueness: every generated browser entry
  // must own both presentation roles canonically.
  it('every subject the browser displays owns both presentation roles', () => {
    const browserSubjects = SUBJECT_NAVIGATION_NAMES
    expect(browserSubjects.length).toBeGreaterThan(0)

    const missing = browserSubjects.filter(
      name => !SUBJECTS[name]?.subjectBrowserAccent || !SUBJECTS[name]?.subjectBrowserAccentDark,
    )
    expect(
      missing,
      `Subjects missing subjectBrowserAccent/subjectBrowserAccentDark in constants/subjects.js: ${missing.join(', ')}`,
    ).toEqual([])
  })
"""
          source, count = pattern.subn(lambda _: replacement_test, source, count=1)
          assert count == 1
          app.write_text(source)

          # Placeholder history is now frozen in the browser-v1 fixture. The live
          # adapter must not retain the cs_* identities after Stage 5B.
          catalogue = Path('tests/architecture/curriculum-catalogue-integrity.test.js')
          source = catalogue.read_text()
          old = "    const subjectCatalogue = read('src/features/subjects/subjectCatalogue.js')\n"
          new = "    const browserFixture = JSON.parse(read('tests/fixtures/subject-browser-v1.json'))\n"
          assert old in source
          source = source.replace(old, new, 1)
          old = "      expect(subjectCatalogue, `${from} was never a placeholder`).toContain(`id: '${from}'`)"
          new = "      expect(browserFixture.placeholderMappings[from], `${from} was never a placeholder`).toBe(to)"
          assert old in source
          source = source.replace(old, new, 1)
          catalogue.write_text(source)

          safety = Path('tests/architecture/placeholder-chapter-safety.test.js')
          source = safety.read_text()
          pattern = re.compile(
              r"  it\('Subjects uses canonical chapter availability and maps non-available chapters to coming_soon', \(\) => \{.*?\n  \}\)\n",
              re.S,
          )
          replacement_test = """  it('generated navigation openability maps to browser coming-soon state', () => {
    const adapter = read('src/features/subjects/subjectCatalogue.js')
    const subjects = read('src/features/subjects/Subjects.jsx')
    expect(adapter).toContain('comingSoon: !card.openable')
    expect(adapter).toContain('openable: card.openable')
    expect(subjects).toMatch(/if\s*\(!item\.openable\)[\s\S]*status:\s*'coming_soon'/)
  })
"""
          source, count = pattern.subn(lambda _: replacement_test, source, count=1)
          assert count == 1
          safety.write_text(source)
          PY

      - name: Regenerate canonical navigation
        run: pnpm curriculum:navigation:generate

      - name: Verify complete repository
        run: pnpm verify

      - name: Mobile runtime smoke at 390px
        run: |
          pnpm vite --host 127.0.0.1 > /tmp/stage5b-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/stage5b-vite.log
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const pageErrors = []
          page.on('pageerror', error => pageErrors.push(error.message))

          await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle' })
          const guest = page.getByRole('button', { name: 'Continue without Google' })
          if (await guest.isVisible().catch(() => false)) {
            await guest.click()
          }
          await page.getByRole('button', { name: 'Subjects' }).waitFor()
          await page.getByRole('button', { name: 'Subjects' }).click()
          await page.getByText('Your subjects', { exact: true }).waitFor()

          const destinations = [
            ['History', 'Medicine through time'],
            ['Biology', 'AQA Biology'],
            ['Chemistry', 'AQA Chemistry'],
            ['Physics', 'AQA Physics'],
            ['Maths', 'AQA Mathematics'],
            ['English', 'AQA English'],
            ['Sociology', 'AQA Sociology'],
          ]

          for (const [label, title] of destinations) {
            await page.getByRole('button', { name: new RegExp(`^${label}`) }).first().click()
            await page.getByText(title, { exact: true }).first().waitFor()
            await page.getByRole('button', { name: 'Go back' }).click()
            await page.getByText('Your subjects', { exact: true }).waitFor()
          }

          if (pageErrors.length) throw new Error(`runtime page errors: ${pageErrors.join(' | ')}`)
          await browser.close()
          NODE

      - name: Commit Stage 5B and remove this executor
        run: |
          rm .github/workflows/stage5b-executor.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            src/features/subjects/Subjects.jsx \
            src/features/subjects/subjectCatalogue.js \
            src/curriculum-catalogue/navigation/README.md \
            src/data/generated/curriculum/navigation.js \
            scripts/generate-curriculum-navigation.mjs \
            docs/curriculum/NAVIGATION_MAP.md \
            tests/unit/subjects/subjectCatalogue.test.js \
            tests/architecture/curriculum-navigation.test.js \
            tests/architecture/curriculum-projection-parity.test.js \
            tests/architecture/canonical-vocabulary.test.js \
            tests/architecture/app-boundaries.test.js \
            tests/architecture/curriculum-catalogue-integrity.test.js \
            tests/architecture/placeholder-chapter-safety.test.js \
            .github/workflows/stage5b-executor.yml
          git commit -m "Switch subject browser to canonical navigation"
          git push origin HEAD:main
