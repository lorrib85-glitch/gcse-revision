name: Execute Stage 5B cutover

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stage5b-executor-main
  cancel-in-progress: true

jobs:
  execute:
    if: contains(github.event.head_commit.message, 'Run canonical browser cutover')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply guarded Stage 5B source and test changes
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/stage5b-cutover.yml').read_text().splitlines()
          wanted = [
              'Write generated-navigation browser adapter',
              'Switch Subjects onto Browser Entry authority',
              'Replace legacy browser unit tests',
              'Update navigation architecture gates',
              'Update navigation lifecycle text',
          ]

          def extract_block(name):
              marker = f'      - name: {name}'
              start = workflow.index(marker)
              run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
              collected = []
              for line in workflow[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if line.startswith('          '):
                      collected.append(line[10:])
                  elif line == '':
                      collected.append('')
                  else:
                      raise RuntimeError(f'unexpected workflow indentation in {name}: {line!r}')
              return '\n'.join(collected) + '\n'

          for name in wanted:
              script = extract_block(name)
              if name == 'Update navigation architecture gates':
                  script = script.replace('\n    parity,\n', '\n    lambda _: parity,\n')
                  script = script.replace('\n    boundary,\n', '\n    lambda _: boundary,\n')
                  if 'lambda _: parity' not in script or 'lambda _: boundary' not in script:
                      raise RuntimeError('failed to repair architecture-test replacement callables')
              print(f'::group::{name}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
              print('::endgroup::', flush=True)
          PY

      - name: Update superseded governance guards
        run: python .github/scripts/stage5b-governance.py

      - name: Regenerate canonical navigation
        run: pnpm curriculum:navigation:generate

      - name: Verify complete repository
        run: pnpm verify

      - name: Mobile runtime smoke at 390px
        run: |
          pnpm vite --host 127.0.0.1 > /tmp/stage5b-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/stage5b-vite.log
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } })
          const pageErrors = []
          page.on('pageerror', error => pageErrors.push(error.message))

          await page.goto('http://127.0.0.1:5173', { waitUntil: 'networkidle' })
          const guest = page.getByRole('button', { name: 'Continue without Google' })
          if (await guest.isVisible().catch(() => false)) {
            await guest.click()
          }
          const nameInput = page.getByPlaceholder('Your name')
          if (await nameInput.isVisible().catch(() => false)) {
            await nameInput.fill('Stage Five')
            await page.getByRole('button', { name: 'Continue →' }).click()
          }

          await page.getByRole('button', { name: 'Subjects' }).waitFor()
          await page.getByRole('button', { name: 'Subjects' }).click()
          await page.getByText('Your subjects', { exact: true }).waitFor()

          const destinations = [
            ['History', 'Medicine through time'],
            ['Biology', 'AQA Biology'],
            ['Chemistry', 'AQA Chemistry'],
            ['Physics', 'AQA Physics'],
            ['Maths', 'AQA Mathematics'],
            ['English', 'AQA English'],
            ['Sociology', 'AQA Sociology'],
          ]

          for (const [label, title] of destinations) {
            await page.getByRole('button', { name: new RegExp(`^${label}`) }).first().click()
            await page.getByText(title, { exact: true }).first().waitFor()
            await page.getByRole('button', { name: 'Go back' }).click()
            await page.getByText('Your subjects', { exact: true }).waitFor()
          }

          if (pageErrors.length) throw new Error(`runtime page errors: ${pageErrors.join(' | ')}`)
          await browser.close()
          NODE

      - name: Commit Stage 5B and remove temporary executor assets
        run: |
          rm .github/workflows/stage5b-executor.yml
          rm .github/scripts/stage5b-governance.py
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            src/features/subjects/Subjects.jsx \
            src/features/subjects/subjectCatalogue.js \
            src/curriculum-catalogue/navigation/README.md \
            src/data/generated/curriculum/navigation.js \
            scripts/generate-curriculum-navigation.mjs \
            docs/curriculum/NAVIGATION_MAP.md \
            tests/unit/subjects/subjectCatalogue.test.js \
            tests/architecture/curriculum-navigation.test.js \
            tests/architecture/curriculum-projection-parity.test.js \
            tests/architecture/canonical-vocabulary.test.js \
            tests/architecture/app-boundaries.test.js \
            tests/architecture/curriculum-catalogue-integrity.test.js \
            tests/architecture/placeholder-chapter-safety.test.js \
            .github/workflows/stage5b-executor.yml \
            .github/scripts/stage5b-governance.py
          git commit -m "Switch subject browser to canonical navigation"
          git push origin HEAD:main
