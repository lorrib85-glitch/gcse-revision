name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Storybook tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run lint, architecture, unit, Storybook and build checks
        run: pnpm verify

  retrieval-registry-guidance:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/retrieval-registry-guidance-final'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply approved registry guidance
        run: python .github/scripts/apply_retrieval_registry_guidance.py

      - name: Commit registry update
        shell: bash
        run: |
          if git diff --quiet -- docs/components/COMPONENT_REGISTRY.md; then
            echo "Registry already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/components/COMPONENT_REGISTRY.md
          git commit -m "Add retrieval component decision guidance"
          git push origin HEAD:${{ github.head_ref }}
