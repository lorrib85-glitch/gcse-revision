name: Repair Stage 5B cutover workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-and-retrigger:
    if: contains(github.event.head_commit.message, 'Repair Stage 5B cutover workflow')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace brittle card-click patch with a guarded regex
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/stage5b-cutover.yml')
          source = path.read_text()
          replacement = '''          replacement = \'\'\'  function handleCardClick(item) {
            if (item.status === 'coming_soon' || !item.openable || item.navigationKind !== 'chapter') return
            const realChapter = CHAPTERS.find(chapter => chapter.id === (item.chapterId || item.id))
            if (realChapter && onOpenChapter) onOpenChapter(realChapter)
          }\'\'\'
          source, count = re.subn(
              r"  function handleCardClick\\(item\\) \\{.*?\\n  \\}\\n\\n  function thumbFor",
              replacement + "\\n\\n  function thumbFor",
              source,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'failed to replace card click boundary' '''

          source, count = re.subn(
              r"          old = \'\'\'  function handleCardClick\(item\) \{.*?          source = source\.replace\(old, new\)",
              replacement,
              source,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'failed to update Stage 5B workflow patch'
          path.write_text(source)
          PY

      - name: Commit repair, retrigger cutover, and remove fixer
        run: |
          rm .github/workflows/stage5b-workflow-fix.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add .github/workflows/stage5b-cutover.yml .github/workflows/stage5b-workflow-fix.yml
          git commit -m "Bootstrap Stage 5B subject-browser cutover"
          git push origin HEAD:main
